<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Stovetop Bakery</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 font-sans text-stone-800">

    <!-- Admin Navbar -->
    <header class="bg-white shadow-sm p-5">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="../../index.html" class="text-3xl font-serif font-bold text-amber-900">Admin Dashboard</a>
            <a href="../../index.html" class="text-stone-600 hover:text-amber-900 font-bold transition">Exit to Bakery</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-10 grid grid-cols-1 md:grid-cols-3 gap-10">
        
        <!-- Left Side: CREATE -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 col-span-1 h-fit">
            <h2 class="text-xl font-bold text-amber-900 mb-4">Add New Brownie</h2>
            
            <form id="crud-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-stone-800 mb-1">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Lava Brownie" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-900" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-stone-800 mb-1">Details</label>
                    <textarea id="itemDetails" rows="2" placeholder="e.g., Rich, dense, and ultra-fudgy..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-900 resize-none" required></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-stone-800 mb-1">Price (Rs.)</label>
                    <input type="number" id="itemPrice" placeholder="e.g., 500" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-900" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-stone-800 mb-1">Image Link</label>
                    <input type="url" id="itemImage" placeholder="Paste image address here..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-900" required>
                </div>  
                <button type="submit" class="w-full bg-amber-900 text-white font-bold py-2 rounded-lg hover:bg-stone-800">Save Item</button>
            </form>
        </div>

        <!-- Right Side: READ, UPDATE, DELETE & SEARCH -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 col-span-2">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-amber-900">Menu Database</h2>
                <input type="text" id="searchInput" placeholder="Search brownies..." class="px-4 py-2 border rounded-lg w-1/2 focus:outline-none focus:ring-2 focus:ring-amber-900">
            </div>
            
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-stone-100 text-stone-600">
                        <th class="p-3 rounded-tl-lg">Item Name</th>
                        <th class="p-3">Details</th>
                        <th class="p-3">Price</th>
                        <th class="p-3 rounded-tr-lg">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <script src="../scripts/admin.js"></script>
                </tbody>
            </table>
        </div>
    </main>
